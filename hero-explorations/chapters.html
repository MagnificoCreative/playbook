<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter Hero Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500&family=Inter:wght@300;400;500&display=swap">
<style>
:root {
  --pink: #ff0074;
  --teal-950: #07171b;
  --teal-900: #002a32;
  --slate-100: #d5def0;
  --canvas: #f6f6f6;
  --n300: #c7c7c7;
  --n700: #474646;
  --hair: rgba(7, 23, 27, 0.1);
  --f-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --f-label: "IBM Plex Sans", "Inter", ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html { scroll-behavior: smooth; }
body { background: var(--canvas); color: var(--teal-950); font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 56px max(16px, 3vw) 120px; }
.eyebrow { font: 500 12px/1 var(--f-label); letter-spacing: .16em; text-transform: uppercase; }

.top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px); gap: 32px 64px; align-items: end; }
.top .eyebrow { color: var(--pink); margin-bottom: 20px; }
.top h1 { font-size: clamp(34px, 4.4vw, 60px); font-weight: 300; line-height: 1.08; letter-spacing: -0.005em; }
.top p { margin-top: 18px; color: var(--n700); font-size: 18px; line-height: 1.5; max-width: 56ch; }
.ref { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; }
.ref .frame { aspect-ratio: 1; min-height: 0; }
.ref p { margin: 0; font-size: 15px; }
.ref b { font-weight: 500; color: var(--teal-950); }

.bar {
  position: sticky; top: 0; z-index: 5; margin: 48px calc(-1 * max(16px, 3vw)) 0; padding: 12px max(16px, 3vw);
  background: rgba(246, 246, 246, .9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--hair);
  display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none;
}
.bar a, .bar button {
  flex: none; font: 500 12px/1 var(--f-label); letter-spacing: .16em; text-transform: uppercase; text-decoration: none;
  color: var(--teal-950); border: 1px solid var(--hair); background: #fff; padding: 11px 14px; border-radius: 999px; cursor: pointer;
}
.bar a:hover { border-color: var(--teal-900); }
.bar .sp { flex: 1; }
.bar button[aria-pressed="true"] { background: var(--teal-900); color: var(--slate-100); border-color: var(--teal-900); }

.chapter { padding-top: 88px; scroll-margin-top: 40px; }
.ch-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 48px; align-items: end; margin-bottom: 32px; }
.ch-head .eyebrow { color: var(--pink); margin-bottom: 14px; }
.ch-head h2 { font-size: clamp(28px, 3.2vw, 44px); font-weight: 300; line-height: 1.15; }
.ch-head p { color: var(--n700); font-size: 17px; line-height: 1.5; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px 24px; }
.frame { position: relative; background: var(--teal-900); border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; }
.frame svg { position: absolute; inset: 6% 0; width: 100%; height: 88%; overflow: visible; }
.badge {
  position: absolute; top: 16px; left: 16px; z-index: 1;
  font: 500 11px/1 var(--f-label); letter-spacing: .16em; text-transform: uppercase;
  color: var(--slate-100); border: 1px solid rgba(213,222,240,.25); padding: 7px 10px; border-radius: 999px;
}
.badge.new { color: #fff; background: var(--pink); border-color: var(--pink); }
.echo .ball, .echo .gd, .echo .glow { display: none; }
.no-trail .echo { display: none; }
.grid.one { grid-template-columns: minmax(0, 1fr); }
.grid.one .frame { aspect-ratio: 21 / 9; }
.grid.one .frame svg { inset: 4% 0; height: 92%; }
.note { padding: 28px 32px; border: 1px dashed rgba(7,23,27,.2); border-radius: 8px; color: var(--n700); font-size: 17px; line-height: 1.5; max-width: 760px; }
.cap { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; margin-top: 18px; }
.cap .l { font: 500 12px/1 var(--f-label); letter-spacing: .16em; color: var(--pink); padding-top: 7px; }
.cap h3 { font-size: 21px; font-weight: 400; line-height: 1.3; }
.cap p { margin-top: 6px; color: var(--n700); font-size: 16px; line-height: 1.5; }
.pick { margin-top: 32px; padding: 20px 24px; border-left: 2px solid var(--pink); background: #fff; border-radius: 0 8px 8px 0; max-width: 860px; }
.pick .eyebrow { color: var(--pink); margin-bottom: 10px; }
.pick p { font-size: 17px; line-height: 1.5; color: var(--teal-950); }

/* SVG language, shared with the Listen hero */
.ln { fill: none; stroke: var(--slate-100); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gd { fill: none; stroke: var(--slate-100); stroke-opacity: .05; stroke-width: 1; }
.ball { fill: var(--pink); }
.dot { fill: var(--slate-100); }
.pnl { fill: var(--teal-900); stroke: var(--slate-100); stroke-opacity: .35; stroke-width: 1.5; }
.fill { fill: var(--teal-900); }
.ghost { fill: none; stroke: var(--pink); stroke-width: 2; stroke-dasharray: 4 5; }

@media (max-width: 860px) {
  .top, .ch-head { grid-template-columns: minmax(0, 1fr); }
  .grid { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Hero motion · Final set · Trail motif</p>
      <h1>The final hero for each chapter</h1>
      <p>One hero per chapter, all in the same language: the ball, the lines, and a short fading trail behind every moving line. Use the Trail button to compare with and without.</p>
    </div>
  </header>

  <nav class="bar" id="bar" aria-label="Chapters"></nav>
  <main id="chapters"></main>
</div>

<script src="chapters/scenes.js"></script>
<script>
(() => {
  const CH = [
    { n: "00", title: "Intro: The dashboard isn’t the problem", note: "This chapter gets its own animation. Send over the brief when it’s ready and it will follow the same language: the ball, the lines, the trail." },
    { n: "01", title: "Listen before you design", brief: "Live in the chapter today.",
      o: [["01", "Many voices, taken in", "Voices arrive from every direction and the ball breathes in as each one lands. With the trail, each voice reads like a quick streak of sound, a little comet heading home."]] },
    { n: "02", title: "Know who decides what", o: [["02c", "Passing the baton", "The decision hops from person to person around the ring, and now it leaves a streak on every pass, so you can feel the hurry. The buck still stops in the ball."]] },
    { n: "03", title: "Follow the data to its source", o: [["03b", "Roots", "Lines run out of the ball like the baton, each finding its own tip at its own pace and leaving a faint root behind. Then they race back, quicker and on a different rhythm, and the ball breathes in as each one lands."]] },
    { n: "04", title: "Agree on what matters", o: [["04b", "Overlap", "Three circles, three priorities, drifting together until all they share is the ball. With the trail, each circle drags a faint wake as it moves, like ripples settling into one."]] },
    { n: "05", title: "Design around decisions", o: [["05d", "Built around it", "Rounded frames twist into place around the ball, one ring at a time. The trail catches every turn, so the build-up feels like a camera shutter closing gently."]] },
    { n: "06", title: "Test before you build", o: [["06c", "Wind tunnel", "Air streams around the ball. The trail stretches each dash into a little streak, so the flow finally reads as speed."]] },
    { n: "07", title: "Where to start", o: [["07h", "True north", "A compass rose with a ring of ticks and eight bearings reaching out. A simple needle spins, the ticks light up as it passes, and it overshoots, wobbles and settles on a heading. Then the heading draws out and quietly pulses: this way."]] },
  ];

  const bar = document.getElementById("bar"), main = document.getElementById("chapters");
  CH.forEach(c => {
    bar.insertAdjacentHTML("beforeend", `<a href="#ch-${c.n}">${c.n}</a>`);
    let inner;
    if (c.note) inner = `<p class="note">${c.note}</p>`;
    else inner = `<div class="grid one">` + c.o.map(([key, name, text, isNew]) => `<article>
        <div class="frame" data-scene="${key}"><span class="badge">Final</span><svg viewBox="0 0 600 600" aria-hidden="true"></svg></div>
        <div class="cap"><span class="l">${key.slice(2).toUpperCase() || "·"}</span><div><h3>${name}</h3><p>${text}</p></div></div>
      </article>`).join("") + `</div>`;
    main.insertAdjacentHTML("beforeend", `<section class="chapter" id="ch-${c.n}">
      <div class="ch-head"><div><p class="eyebrow">Chapter ${c.n}</p><h2>${c.title}</h2></div><p>${c.brief || ""}</p></div>
      ${inner}
    </section>`);
  });
  bar.insertAdjacentHTML("beforeend", `<span class="sp"></span><button type="button" id="trail" aria-pressed="true">Trail on</button><button type="button" id="pause" aria-pressed="false">Pause</button>`);

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scenes = [...document.querySelectorAll("[data-scene]")].map(f => ({ f, draw: window.HeroMount(f.querySelector("svg"), f.dataset.scene), visible: false }));
  const io = new IntersectionObserver(es => es.forEach(e => { const s = scenes.find(x => x.f === e.target); if (s) s.visible = e.isIntersecting; }), { rootMargin: "100px" });
  let clock = 2.5;
  scenes.forEach(s => { s.draw(clock); io.observe(s.f); });

  let paused = reduce, last = performance.now();
  const btn = document.getElementById("pause"), tbtn = document.getElementById("trail");
  const sync = () => { btn.setAttribute("aria-pressed", String(paused)); btn.textContent = paused ? "Play" : "Pause"; };
  sync();
  btn.addEventListener("click", () => { paused = !paused; sync(); });
  tbtn.addEventListener("click", () => {
    const off = document.body.classList.toggle("no-trail");
    tbtn.setAttribute("aria-pressed", String(!off)); tbtn.textContent = off ? "Trail off" : "Trail on";
    scenes.forEach(s => s.draw(clock));
  });
  const tick = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!paused) { clock += dt; scenes.forEach(s => s.visible && s.draw(clock)); }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
