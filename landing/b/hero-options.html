<style>
  /* Full-bleed light hero: the scene fills the whole hero behind the copy and answers the pointer.
     Light-card language from ANIMATION-RULES (2026-11-06): teal lines at the hero's opacities, pink ball, radar trail. */
  body { background: #fff; }
  .fx-hero { position: relative; isolation: isolate; height: calc(100svh - 64px); min-height: 620px; overflow: hidden; background: #fff; display: grid; place-items: center; text-align: center; touch-action: pan-y; }
  .fx-canvas { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; display: block; }
  /* A soft white veil behind the copy keeps the type crisp while the scene runs at full strength everywhere else */
  /* No CSS veil: the lines fade themselves behind the copy (see quiet() in the script), so the pink ball stays vivid */
  .fx-copy { position: relative; display: flex; flex-direction: column; align-items: center; gap: var(--element-gap); padding: 0 var(--pad); margin-top: -4vh; pointer-events: none; }
  .fx-copy a, .fx-copy button { pointer-events: auto; }
  .hero-lead { max-width: 36ch; text-wrap: balance; }

  /* Option switcher */
  .fx-switch { position: fixed; z-index: 60; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; width: max-content; max-width: calc(100vw - 32px); }
  .fx-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.72); box-shadow: 0 0 0 1px var(--control); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); }
  .fx-tabs button { display: inline-flex; align-items: baseline; gap: 8px; padding: 10px 16px; border-radius: 999px; font-size: 14px; letter-spacing: -0.224px; color: var(--ink-2); white-space: nowrap; transition: background-color .3s var(--ease), color .3s var(--ease); }
  .fx-tabs button b { font: 500 12px/1 var(--f-label); letter-spacing: .16em; color: var(--accent); }
  .fx-tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .fx-tabs button[aria-pressed="true"] b { color: var(--pink); }
  .fx-tabs-s { align-items: center; padding: 3px; }
  .fx-tabs-s button { padding: 6px 12px; font-size: 12px; letter-spacing: -0.12px; }
  .fx-tabs-label { font: 300 12px/1 var(--f-text); color: var(--ink-2); padding: 0 6px 0 10px; }
  .fx-note { font: 300 12px/1.4 var(--f-text); color: var(--ink-2); text-align: center; max-width: 52ch; padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  @media (max-width: 734px) {
    .fx-hero { height: calc(100svh - 56px); min-height: 560px; }
    .fx-tabs button { padding: 9px 12px; font-size: 13px; }
    .fx-tabs button span { display: none; }
    .fx-tabs-s button { padding: 6px 9px; }
  }
</style>

<script src="hero-fx.js?v=2"></script>
<script>
(() => {
  const NOTES = {
    field: "Every needle is a version of the number, pointing its own way. Move the pointer: the ball follows, and the needles near it turn to agree.",
    agree: "The hero scene at full size. The needles swing toward your pointer and line up as you come close to the ball.",
    contours: "Flow lines, like an isobar map. They bend around the ball as it follows you, and ripple when you move fast.",
    shift: "Agreement first. Then the needles lie down and stretch into flow lines while the contours spread out from the ball, and back again: a 24-second loop.",
  };
  const hero = document.getElementById("fx"), note = document.getElementById("fx-note");
  const start = NOTES[location.hash.slice(1)] ? location.hash.slice(1) : "field";
  const fx = HeroFX.mount(hero, { canvas: document.getElementById("fx-canvas"), copy: document.querySelector(".fx-copy"), scene: start, lines: .8 });
  const show = (key) => {
    fx.setScene(key); note.textContent = NOTES[key];
    document.querySelectorAll("button[data-scene]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.scene === key ? "true" : "false"));
    try { history.replaceState(null, "", "#" + key); } catch (e) {}
  };
  document.querySelectorAll("button[data-scene]").forEach((b) => b.addEventListener("click", () => show(b.dataset.scene)));
  addEventListener("keydown", (e) => { const k = { "1": "field", "2": "agree", "3": "contours", "4": "shift" }[e.key]; if (k) show(k); });
  document.querySelectorAll("[data-lines]").forEach((b) => b.addEventListener("click", () => {
    fx.setLines(+b.dataset.lines);
    document.querySelectorAll("[data-lines]").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  }));
  show(start);
})();
</script>
